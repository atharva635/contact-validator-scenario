name: Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=markdown:coverage.md --cov-fail-under=85
      - name: Add coverage to step summary
        if: always()
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"
